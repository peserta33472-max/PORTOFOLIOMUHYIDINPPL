<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Portofolio PPG</title>
<meta name="description" content="Dokumentasi praktik pembelajaran, refleksi, dan pengembangan profesional guru.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F2A4A;--sky:#DCEBFA;--bg:#F3F5F8;--white:#fff;--accent:#F2A33A;--text:#1d2b3a;--muted:#5a6b7d;--line:#dbe2ea;
--head:"Playfair Display",Georgia,serif;--body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:400 17px/1.7 var(--body);color:var(--text);background:var(--bg)}
h1,h2,h3{font-family:var(--head);color:var(--navy);line-height:1.25;margin:0 0 .6em}
h3{font-size:1.1rem}a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
#loader{position:fixed;inset:0;background:var(--navy);display:grid;place-items:center;z-index:99;transition:opacity .4s}
#loader i{width:38px;height:38px;border:4px solid #ffffff44;border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
header{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:700 1.15rem var(--head);text-decoration:none;display:flex;gap:10px;align-items:center}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px}
nav a,nav button{color:#fff;text-decoration:none;font:600 .82rem var(--body);letter-spacing:.02em;padding:10px 12px;border-radius:8px;background:none;border:0;cursor:pointer;display:block}
nav a:hover,nav button:hover{background:#ffffff1f}
.dd{position:relative}.dd ul{display:none;position:absolute;right:0;top:100%;flex-direction:column;background:var(--white);border-radius:10px;padding:6px;min-width:170px;box-shadow:0 10px 30px #0f2a4a33}
.dd:hover ul,.dd.open ul{display:flex}.dd ul a{color:var(--navy)}.dd ul a:hover{background:var(--sky)}
#burger{display:none;background:none;border:0;color:#fff;font-size:1.7rem;cursor:pointer;padding:6px 10px}
@media(max-width:900px){#burger{display:block}nav{display:none;position:absolute;left:0;right:0;top:64px;background:var(--navy);padding:8px 20px 16px}
nav.open{display:block}nav ul{flex-direction:column}.dd ul{display:flex;position:static;background:none;box-shadow:none;padding:0 0 0 14px}.dd ul a{color:#fff}.dd ul a:hover{background:#ffffff1f}}
main{min-height:70vh;animation:in .35s ease}@keyframes in{from{opacity:0}to{opacity:1}}
.hero{background:linear-gradient(160deg,var(--navy) 0%,#17406e 100%);color:#fff;padding:72px 0}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center}
.hero h1{color:#fff;font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:.3em}
.hero p.sub{color:#cfe0f3;font-size:1.15rem;max-width:30em}
.pf{display:flex;flex-direction:column;align-items:center;text-align:center;background:#ffffff12;border:1px solid #ffffff2a;border-radius:20px;padding:32px 24px}
.pf b{font:600 1.3rem var(--head)}.pf span{color:#cfe0f3;font-size:.98rem}
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;background:var(--sky);display:grid;place-items:center;color:var(--navy);border:4px solid var(--accent);margin-bottom:14px}
.avatar.lg{width:210px;height:210px;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#2a1c00;font-weight:600;text-decoration:none;padding:12px 24px;border-radius:10px;border:0;cursor:pointer;font-size:1rem;font-family:var(--body);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #0f2a4a33}
.btn.alt{background:var(--white);color:var(--navy);border:1.5px solid var(--navy)}.btn.alt:hover{background:var(--sky)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
section.blk{padding:56px 0}.blk.white{background:var(--white)}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
a.mc{display:flex;gap:16px;align-items:flex-start;text-decoration:none;background:var(--white);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:14px;padding:22px;transition:transform .2s,box-shadow .2s,border-color .2s}
a.mc:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0f2a4a1f;border-left-color:var(--accent)}
a.mc svg{flex:none;width:30px;height:30px;stroke:var(--navy);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.mc b{font:600 1.05rem var(--head);color:var(--navy);display:block}a.mc small{color:var(--muted)}
.tl{list-style:none;display:flex;margin:32px 0 0;padding:0;counter-reset:t}
.tl li{flex:1;text-align:center;position:relative;padding-top:34px}
.tl li::before{content:"";position:absolute;top:8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--navy);border:4px solid var(--sky);z-index:1}
.tl li::after{content:"";position:absolute;top:16px;left:50%;width:100%;height:3px;background:var(--sky)}
.tl li:last-child::after{display:none}
.tl a{text-decoration:none;font-weight:600;color:var(--navy);display:inline-block;padding:4px 8px;border-radius:8px}.tl a:hover{background:var(--sky)}
@media(max-width:760px){.tl{flex-direction:column;border-left:3px solid var(--sky);margin-left:10px}.tl li{text-align:left;padding:0 0 22px 28px}
.tl li::before{left:-11px;top:4px;margin:0}.tl li::after{display:none}.hero .wrap{grid-template-columns:1fr}}
.crumb{font-size:.92rem;color:var(--muted);padding:20px 0 0}.crumb a{color:var(--navy)}
.pagehead{padding:20px 0 8px}.pagehead p{color:var(--muted);max-width:44em}
.two{display:grid;grid-template-columns:1.7fr 1fr;gap:24px;align-items:start}@media(max-width:860px){.two{grid-template-columns:1fr}}
.prev{width:100%;height:560px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.empty{display:grid;place-items:center;text-align:center;min-height:240px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);padding:20px;background:var(--bg)}
.side{display:flex;flex-direction:column;gap:12px}.side .btn{justify-content:center}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid.empty{background:var(--bg);aspect-ratio:16/9}
table{width:100%;border-collapse:collapse}td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{font-weight:600;color:var(--navy);width:38%}
.ana h3{margin:1.4em 0 .2em;padding-left:12px;border-left:4px solid var(--accent)}.ana h3:first-of-type{margin-top:.4em}
.ana p{margin:0;white-space:pre-line}
.ph{color:#8a97a6;font-style:italic}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gal button{padding:0;border:0;background:var(--sky);border-radius:12px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;transition:transform .2s}.gal button:hover{transform:scale(1.02)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.act{display:grid;grid-template-columns:240px 1fr;gap:22px}@media(max-width:700px){.act{grid-template-columns:1fr}}
.act img,.act .noimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--sky)}
.act .noimg{display:grid;place-items:center;color:var(--muted);font-size:.9rem}
.act dl{margin:0}.act dt{font-weight:600;color:var(--navy);margin-top:8px}.act dd{margin:0}
.quote{background:var(--navy);color:#fff;border-radius:16px;padding:36px;font:italic 600 1.35rem/1.5 var(--head);text-align:center}
.mini{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
footer{background:var(--navy);color:#cfe0f3;padding:44px 0;margin-top:40px;text-align:center;font-size:.95rem}
footer b{display:block;color:#fff;font:700 1.25rem var(--head)}footer a{color:#fff;margin:0 8px}
#top{position:fixed;right:20px;bottom:20px;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#2a1c00;font-size:1.3rem;cursor:pointer;display:none;box-shadow:0 6px 16px #0003}
#lb{position:fixed;inset:0;background:#000d;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff}
#lb.on{display:flex}#lb img{max-width:92vw;max-height:76vh;border-radius:8px}
#lb button{position:absolute;background:#ffffff25;color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.5rem;cursor:pointer}
#lb .x{top:16px;right:16px}#lb .p{left:14px;top:50%}#lb .n{right:14px;top:50%}
dialog{border:0;border-radius:16px;padding:26px;width:min(560px,94vw)}dialog::backdrop{background:#0008}
label{display:block;font-weight:600;font-size:.92rem;margin-top:10px}
input,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px}
.note{background:var(--sky);border-radius:10px;padding:10px 14px;font-size:.92rem}
/* ===== LAPISAN DESAIN V2 ===== */
body{background:var(--bg) radial-gradient(#0f2a4a14 1px,transparent 1px) 0 0/28px 28px}
header{border-bottom:3px solid var(--accent);box-shadow:0 6px 20px #0f2a4a40}
nav>ul>li>a,.dd>button{position:relative}
.btn{border-radius:999px;padding:13px 28px;box-shadow:0 4px 0 #c47d12}.btn:hover{box-shadow:0 7px 0 #c47d12;transform:translateY(-3px)}
.btn.alt{box-shadow:0 4px 0 var(--sky)}.btn.alt:hover{box-shadow:0 7px 0 var(--sky)}
.hero{position:relative;overflow:hidden;padding:88px 0 112px;border-radius:0 0 56px 56px;background:radial-gradient(circle at 88% 15%,#2f72b3 0,transparent 42%),linear-gradient(160deg,var(--navy),#143a66)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff2e 1.5px,transparent 1.5px);background-size:26px 26px;-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000);mask-image:linear-gradient(90deg,transparent 30%,#000)}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(2.7rem,6.5vw,4.6rem);letter-spacing:-.01em;margin-bottom:.35em}
.hero h1::after{content:"";display:block;width:84px;height:6px;border-radius:6px;background:var(--accent);margin-top:18px}
.hero .wrap>div:first-child>*{animation:rise .7s both}.hero .wrap>div:first-child>:nth-child(2){animation-delay:.12s}.hero .wrap>div:first-child>:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.pf{background:none;border:0;padding:0}
.pf .avatar{width:210px;height:262px;border-radius:105px 105px 22px 22px;border:6px solid #fff;box-shadow:14px 14px 0 var(--accent);margin-bottom:28px}
.pf b{font-size:1.55rem}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.chips span{background:var(--sky);color:var(--navy);font-weight:600;font-size:.93rem;padding:6px 15px;border-radius:999px}
.blk h2::after,.card>h2::after{content:"";display:block;width:52px;height:4px;border-radius:4px;background:var(--accent);margin-top:10px}
.card{border:0;border-radius:20px;box-shadow:0 10px 32px #0f2a4a14}
.card.ana{border-top:5px solid var(--navy)}
a.mc{border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px #0f2a4a0f;padding:24px}
a.mc svg{width:54px;height:54px;padding:12px;border-radius:15px;background:var(--sky);transition:background .2s,stroke .2s}
a.mc:hover{background:var(--navy);border-color:var(--navy)}a.mc:hover b{color:#fff}a.mc:hover small{color:#cfe0f3}a.mc:hover svg{stroke:#fff;background:#ffffff26}
.tl li{counter-increment:t}
.tl li::before{content:counter(t);top:0;width:36px;height:36px;margin-left:-18px;display:grid;place-items:center;color:#fff;font:600 .9rem var(--body);background:var(--navy);border:4px solid var(--accent)}
.tl li::after{top:16px;height:4px;background:linear-gradient(90deg,var(--accent) 50%,var(--sky) 50%)}
.tl li{padding-top:46px}.tl a{background:var(--white);box-shadow:0 4px 14px #0f2a4a14;padding:6px 14px}.tl a:hover{background:var(--navy);color:#fff}
@media(max-width:760px){.tl li{padding:0 0 22px 34px}.tl li::before{left:-20px;top:0;margin:0}.tl{margin-left:16px}}
.banner{background:linear-gradient(135deg,var(--navy),#1b4a7d);color:#fff;border-radius:0 0 40px 40px;margin-bottom:26px;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:34px solid #ffffff12}
.banner .pagehead{padding:34px 20px 42px;position:relative;z-index:1}.banner h1{color:#fff;font-size:clamp(1.6rem,4vw,2.5rem);margin:0}.banner h1::after{content:"";display:block;width:52px;height:4px;border-radius:4px;background:var(--accent);margin-top:12px}
.banner p{color:#cfe0f3;margin:14px 0 0}.banner .ph{color:#9fb7d1}
.crumb{background:var(--white);padding:12px max(20px,calc((100% - 1040px)/2));max-width:none;margin:0;border-bottom:1px solid var(--line)}
.quote{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy),#1b4a7d);padding:52px 40px 40px}
.quote::before{content:"“";position:absolute;top:-34px;left:22px;font:700 10rem var(--head);color:var(--accent);opacity:.4}
footer{border-top:5px solid var(--accent);border-radius:40px 40px 0 0}

/* ===== LAPISAN DESAIN V3: TEMA CERAH ===== */
:root{--navy:#1565d8;--deep:#0b3a82;--sky:#E3F2FF;--bg:#F7FBFC;--accent:#FFB020;--text:#23364d;--muted:#5f7790;--line:#d6e6f7;--mint:#3dbb9d}
body{background:var(--bg) radial-gradient(#1565d826 1px,transparent 1px) 0 0/26px 26px}
h1,h2,h3{color:var(--deep)}
#loader{background:linear-gradient(135deg,#1e88e5,#38bdf8)}
header{background:#ffffffee;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--deep);border-bottom:4px solid var(--accent);box-shadow:0 6px 22px #1565d826}
.logo{color:var(--deep)}.logo svg{stroke:var(--navy)}
nav a,nav button{color:var(--deep)}
nav a:hover,nav button:hover{background:var(--sky);color:var(--navy)}
nav a[aria-current=page],.dd>button.active{background:var(--navy);color:#fff}
.dd ul{box-shadow:0 12px 32px #1565d833;border:1px solid var(--line)}
#burger{color:var(--deep)}
@media(max-width:900px){nav{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 14px 24px #1565d822}.dd ul a{color:var(--deep)}.dd ul a:hover{background:var(--sky)}}
.hero{background:radial-gradient(circle at 90% 10%,#7dd3fc 0,transparent 45%),radial-gradient(circle at 5% 100%,#5eead4aa 0,transparent 40%),linear-gradient(135deg,#1e78e6,#2aa4f0)}
.hero p.sub{color:#fff;opacity:.95}
.pf span{color:#fff;opacity:.95}
.pf .avatar{box-shadow:14px 14px 0 var(--accent);background:#fff;color:var(--navy)}
.btn{color:#3a2500;box-shadow:0 4px 0 #e0900a}.btn:hover{box-shadow:0 7px 0 #e0900a}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:0 4px 0 #bcd9fa}.btn.alt:hover{background:var(--sky);box-shadow:0 7px 0 #bcd9fa}
.blk.white{background:linear-gradient(180deg,#fff,#EEF7FF)}
.chips span{background:#fff;border:1.5px solid #bcd9fa;color:var(--navy)}
.chips span:nth-child(3n+1){background:#E3F2FF}.chips span:nth-child(3n+2){background:#FFF3D6;border-color:#ffd88a;color:#7a4a00}.chips span:nth-child(3n){background:#D9F7F2;border-color:#9be5da;color:#0b6b60}
.card{box-shadow:0 10px 30px #1565d81a}
.card.ana{border-top:5px solid var(--navy)}
a.mc{box-shadow:0 8px 24px #1565d814}
a.mc:nth-child(3n+2) svg{background:#FFF3D6;stroke:#c47d00}
a.mc:nth-child(3n) svg{background:#D9F7F2;stroke:#0b8a7c}
a.mc:hover{background:var(--navy);border-color:var(--navy)}
a.mc:hover svg{background:#ffffff33;stroke:#fff}
.tl li::before{background:var(--navy);border-color:var(--accent)}
.tl a{color:var(--deep)}.tl a:hover{background:var(--navy);color:#fff}
.banner{background:radial-gradient(circle at 95% 0,#7dd3fc 0,transparent 45%),linear-gradient(135deg,#1e78e6,#2aa4f0)}
.banner p{color:#fff;opacity:.95}.banner .ph{color:#e3f2ff}
.crumb{background:#fff}
.quote{background:linear-gradient(135deg,#1e78e6,#2aa4f0)}
footer{background:linear-gradient(180deg,#E3F2FF,#cfe8ff);color:var(--deep);border-top:5px solid var(--accent)}
footer b{color:var(--deep)}footer a{color:var(--navy)}
#top{box-shadow:0 6px 16px #1565d844}
.note{background:var(--sky)}
/* ===== AKHIR LAPISAN DESAIN V3 ===== */
/* ===== LAPISAN DESAIN V4: TEMA VIBRANT ===== */
:root{--navy:#3484cf;--deep:#1f3b57;--violet:#3484cf;--cyan:#2fae9f;--pink:#f29b7b;--sun:#f6c453;--mint:#3dbb9d;--sky:#E8F4FA;--bg:#F7FBFC;--line:#dbe9ef;--text:#2b3d4f;--muted:#5f7288;
--head:"Poppins",system-ui,sans-serif;--body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--bg) radial-gradient(#3484cf1f 1.2px,transparent 1.2px) 0 0/26px 26px}
h1,h2,h3{font-family:var(--head);letter-spacing:-.01em}
.rv{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease}.rv.in{opacity:1;transform:none}
header{border-bottom:0;background:#ffffffd9;box-shadow:0 8px 30px #3484cf22}
header::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--mint),var(--sun),var(--pink))}
.logo{font:800 1.15rem var(--head)}.logo svg{stroke:var(--violet)}
nav a,nav button{font:700 .8rem var(--body);border-radius:999px}
nav a:hover,nav button:hover{background:var(--sky);color:var(--violet)}
nav a[aria-current=page],.dd>button.active{background:linear-gradient(135deg,var(--violet),var(--navy));color:#fff;box-shadow:0 6px 16px #3484cf55}
.btn{background:linear-gradient(135deg,#f7cf5e,#f4a259);color:#3a1a00;font-weight:700;box-shadow:0 8px 20px #f4a25966}
.btn:hover{box-shadow:0 12px 26px #f4a25988;transform:translateY(-3px) scale(1.03)}
.btn.alt{background:#fff;color:var(--violet);border:2px solid var(--violet);box-shadow:0 6px 16px #3484cf22}.btn.alt:hover{background:var(--sky);box-shadow:0 10px 22px #3484cf33}
.btn.ghost{background:#ffffff26;color:#fff;border:2px solid #ffffffaa;box-shadow:none;backdrop-filter:blur(6px)}.btn.ghost:hover{background:#ffffff40;box-shadow:none}
/* HERO */
.hero{border-radius:0;padding:84px 0 130px;background:linear-gradient(135deg,#3484cf 0%,#3b9bd0 48%,#2fae9f 100%)}
.hero::before{-webkit-mask-image:none;mask-image:none;opacity:.55}
.hero .blob{position:absolute;border-radius:50%;filter:blur(2px);animation:flt 9s ease-in-out infinite}
.blob.b1{width:340px;height:340px;right:-80px;top:-90px;background:radial-gradient(circle,#f29b7b99,transparent 68%)}
.blob.b2{width:300px;height:300px;left:-90px;bottom:-60px;background:radial-gradient(circle,#3dbb9d88,transparent 68%);animation-delay:-3s}
.blob.b3{width:200px;height:200px;left:42%;top:12%;background:radial-gradient(circle,#f6c45377,transparent 68%);animation-delay:-6s}
@keyframes flt{50%{transform:translate(18px,-22px) scale(1.08)}}
.eyebrow{display:inline-block;background:#ffffff2e;border:1px solid #ffffff66;backdrop-filter:blur(6px);color:#fff;font-weight:700;font-size:.88rem;padding:7px 16px;border-radius:999px;margin-bottom:18px}
.hero h1{font:800 clamp(2.6rem,6.5vw,4.8rem)/1.05 var(--head);color:#fff;margin-bottom:.3em}
.hero h1::after{background:linear-gradient(90deg,var(--sun),var(--pink));width:96px}
.grad{background:linear-gradient(90deg,#ffe27a,#ffb3d1);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{font-size:1.18rem;max-width:30em}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}
.pf{position:relative;padding:10px 0 0}

}
function section(base, def, bc) {
  const [k, t, ty, lb] = def, d = C.konten[`${base}/${k}`] || {};
  const body = ty === "ytmedia" ? ytMediaSec(t, LBL[lb], d) : ty === "doc" ? docSec(t, LBL[lb], d, null, k === "instrumen" ? (INS[base] || 1) : 1) : ty === "video" ? vidSec(t, LBL.video, d) : galSec(d);
  return crumbs(bc.concat([[t]])) + head(t) + body;
}

/* Lightbox */
let li = 0;
const lb = $("#lb");
function showLB(i) { li = (i + GAL.length) % GAL.length; lb.querySelector("img").src = GAL[li].src; lb.querySelector("img").alt = GAL[li].caption; $("#cap").textContent = GAL[li].caption; }
const closeLB = () => lb.classList.remove("on");
lb.querySelector(".x").onclick = closeLB; lb.querySelector(".p").onclick = () => showLB(li - 1); lb.querySelector(".n").onclick = () => showLB(li + 1);
lb.onclick = e => { if (e.target === lb) closeLB(); };
document.addEventListener("keydown", e => { if (!lb.classList.contains("on")) return; if (e.key === "Escape") closeLB(); if (e.key === "ArrowLeft") showLB(li - 1); if (e.key === "ArrowRight") showLB(li + 1); });
let sx = 0; lb.addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
lb.addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) showLB(li + (dx < 0 ? 1 : -1)); });

function addDlg() {
  const f = [["src", "Link foto Google Drive"], ["nama", "Nama kegiatan"], ["tanggal", "Tanggal"], ["deskripsi", "Deskripsi"], ["peran", "Peran yang dilakukan"], ["hasil", "Hasil kegiatan"], ["refleksi", "Refleksi singkat"]];
  const d = $("#dlg");
  d.innerHTML = `<h2>Tambah Dokumentasi</h2><p class="note">Website ini statis, jadi data tidak tersimpan otomatis. Isi form, salin kode yang muncul, lalu tempel ke bagian <b>CONFIG</b> pada file HTML ini.</p><form method="dialog" id="af">${f.map(([k, l]) => `<label for="f_${k}">${l}</label><input id="f_${k}" name="${k}">`).join("")}<p><button type="button" class="btn" id="gen">Buat kode</button> <button class="btn alt">Tutup</button></p></form><textarea id="out" rows="8" readonly aria-label="Kode hasil" hidden></textarea>`;
  d.showModal();
  $("#gen").onclick = () => {
    const v = k => JSON.stringify($("#f_" + k).value || "");
    $("#out").hidden = false;
    $("#out").value = `// Tempel di array "foto":\n{ src:${v("src")}, caption:${v("nama")} },\n\n// Tempel di array "kegiatan":\n{ foto:${v("src")}, nama:${v("nama")}, tanggal:${v("tanggal")}, deskripsi:${v("deskripsi")}, peran:${v("peran")}, hasil:${v("hasil")}, refleksi:${v("refleksi")} },`;
    $("#out").select();
  };
}
document.addEventListener("click", e => {

});
